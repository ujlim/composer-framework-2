# Enable only after validating the deployment runner and granting the protected
# dev/prod triggers separate deployment identities. No main deployment trigger.
steps:
  - id: capture-accepted-release
    name: '${_TOOLS_IMAGE}'
    entrypoint: bash
    args:
      - -ceu
      - |
        test '${REF_NAME}' = '${_RELEASE_BRANCH}'
        python -c 'import yaml; from google.cloud import storage'
        test "$$(git rev-parse '${COMMIT_SHA}^{commit}')" = '${COMMIT_SHA}'
        git remote get-url origin
        python tools/deployment/publish.py inventory --target '${_TARGET}' --control '${_CONTROL}' > /workspace/deploy-base.json
  - id: validate-complete-candidate
    name: '${_VALIDATION_IMAGE}'
    entrypoint: bash
    env: ['PYTHONDONTWRITEBYTECODE=1', 'AIRFLOW__CORE__LOAD_EXAMPLES=False']
    args:
      - -ceu
      - |
        python tools/deployment/candidate.py assemble \
          --sources '${_SOURCES_LOCK}' --source-commit '${COMMIT_SHA}' --output /workspace/candidate
        python tools/deployment/candidate.py validate --candidate /workspace/candidate
        python -m unittest discover -s tests
        python tools/deployment/full_parse.py --candidate /workspace/candidate --image '${_VALIDATION_IMAGE}'
  - id: publish-or-plan
    name: '${_TOOLS_IMAGE}'
    entrypoint: bash
    env: ['PYTHONDONTWRITEBYTECODE=1']
    args:
      - -ceu
      - |
        if [ '${_EXECUTE}' = 'true' ]; then
          python tools/deployment/publish.py auto-apply --candidate /workspace/candidate \
            --target '${_TARGET}' --control '${_CONTROL}' \
            --branch '${_RELEASE_BRANCH}' --commit '${COMMIT_SHA}' --wait-seconds 900 \
            --execute --confirm-prefix '${_TARGET}'
        elif [ '${_EXECUTE}' = 'false' ]; then
          BASE=$$(python -c 'import json; print(json.load(open("/workspace/deploy-base.json"))["state"]["release"])')
          python tools/deployment/publish.py plan --candidate /workspace/candidate \
            --target '${_TARGET}' --control '${_CONTROL}' --expected-release "$$BASE"
        else
          echo '_EXECUTE must be true or false' >&2; exit 2
        fi

substitutions:
  _SOURCES_LOCK: 'deployment/sources.example.json'
  _VALIDATION_IMAGE: 'REPLACE_REGISTRY/composer-validation@sha256:REPLACE_DIGEST'
  _TOOLS_IMAGE: 'REPLACE_REGISTRY/deployment-tools@sha256:REPLACE_DIGEST'
  _TARGET: 'gs://REPLACE_COMPOSER_BUCKET/dags'
  _CONTROL: 'gs://REPLACE_CONTROL_BUCKET/REPLACE_ENVIRONMENT'
  _RELEASE_BRANCH: 'prod'
  _EXECUTE: 'false'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
