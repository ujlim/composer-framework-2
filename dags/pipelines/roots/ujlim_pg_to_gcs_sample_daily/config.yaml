version: 1

root:
  root_id: ujlim_pg_to_gcs_sample_daily
  description: Daily Root DAG for PostgreSQL to GCS export sample
  owner: framework-test
  schedule: "0 2 * * *"
  timezone: Asia/Seoul
  start_date: "2026-01-01"
  catchup: false
  max_active_runs: 1
  tags: [sample, test, postgres, cloudsql, gcs]

business_date:
  type: daily
  source: data_interval_end
  offset_days: -1
  timezone: Asia/Seoul

defaults:
  wait_for_completion: true
  poke_interval_seconds: 30
  execution_timeout_seconds: 7200
  reset_dag_run: false
  deferrable: true

vines:
  - vine_id: ujlim_pg_to_gcs_sample
