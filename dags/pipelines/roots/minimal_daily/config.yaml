version: 1

root:
  root_id: minimal_daily_root
  description: Root DAG test - triggers one Vine
  owner: framework-test
  schedule: "0 2 * * *"
  timezone: Asia/Seoul
  start_date: "2026-01-01"
  catchup: false
  max_active_runs: 1
  tags:
    - test

# Scheduled run business-date policy.
# Example: 2026-08-19 02:00 run -> business_date=2026-08-18
business_date:
  type: daily
  source: data_interval_end
  offset_days: -1
  timezone: Asia/Seoul

defaults:
  wait_for_completion: true
  poke_interval_seconds: 30
  execution_timeout_seconds: 3600
  reset_dag_run: false
  deferrable: true

vines:
  - vine_id: minimal_bq_vine

# business context is framework-managed and automatically passed to Vine DAGs.
parameters:
  recovery:
    value: "{{ dag_run.conf.get('recovery', false) }}"
