version: 1

root:
  root_id: sample_business_yearly_root
  description: Sample Yearly business context Root
  owner: framework-test
  schedule: "0 2 1 1 *"
  timezone: Asia/Seoul
  start_date: "2026-01-01"
  catchup: false
  max_active_runs: 1
  tags: [sample, test, business-date, yearly]

business_date:
  type: yearly
  source: data_interval_end
  offset_days: -1
  timezone: Asia/Seoul

defaults:
  wait_for_completion: true
  poke_interval_seconds: 30
  execution_timeout_seconds: 3600
  reset_dag_run: false
  deferrable: true

vines:
  - vine_id: sample_business_yearly_vine
