version: 1

root:
  root_id: root_fin_sensor_daily
  description: Run FIN sensor Vine first, then downstream Vines after FIN file appears
  owner: framework-test
  schedule: "0 2 * * *"
  timezone: Asia/Seoul
  start_date: "2026-01-01"
  catchup: false
  max_active_runs: 1
  dagrun_timeout_seconds: 28800
  tags: [sample, test, fin-file, sensor]

business_date:
  type: daily
  source: data_interval_end
  offset_days: -1
  timezone: Asia/Seoul

defaults:
  wait_for_completion: true
  poke_interval_seconds: 30
  execution_timeout_seconds: 25200
  reset_dag_run: false
  deferrable: true

vines:
  - vine_id: vine_fin_sensor

  - vine_id: vine_fin_downstream_01
    depends_on:
      - vine_fin_sensor

  - vine_id: vine_fin_downstream_02
    depends_on:
      - vine_fin_sensor
