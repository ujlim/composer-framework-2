version: 1

vine:
  vine_id: ujlim_pg_operator_sample
  description: Sample Vine for simple Cloud SQL PostgreSQL SQL execution with dedicated DB password secret
  owner: framework-test
  schedule: null
  timezone: Asia/Seoul
  start_date: "2026-01-01"
  max_active_runs: 1
  dagrun_timeout_seconds: 3600
  tags: [sample, test, postgres, cloudsql, secret-manager, silver]

business_date:
  type: daily

runtime:
  gcp_conn_id: google_cloud_default
  # Used for Google data-service access. The DB password secret itself is read by Composer SA.
  impersonation_chain: sa-prod-sa-ubi-airflow-user-silver@gcp-prod-edp-sa-ubi.iam.gserviceaccount.com
  postgres_connection_id: conn-sql-pg-udw-user1

# Airflow Connection conn-sql-pg-udw-user1 stores connection metadata, not the DB password:
#   host=172.31.38.136
#   port=21001
#   schema=db_ubis_rpt
#   login=usr_airf_svc
#   extra:
#     password_project_id: gcp-prod-edp-sa-udw
#     password_secret_id: secret-db-password-prod-sa-udw-postgres-1-usr_airf_svc-1
# Composer management SA requires roles/secretmanager.secretAccessor on that password secret.

grape_defaults:
  retries: 1
  retry_delay_seconds: 60
  execution_timeout_seconds: 1800
  connect_timeout_seconds: 30
  pool: default_pool
  priority_weight: 1

grapes:
  - grape_id: query_postgres
    type: postgres_sql
    sql_file: sql/010_query_business_date.sql
    parameters:
      business_date: "{{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}"
    options:
      autocommit: false
      fetch: all
      max_fetch_rows: 10
