version: 1

vine:
  vine_id: ujlim_pg_operator_sample
  description: Sample Vine for Cloud SQL PostgreSQL SQL execution and GCS export using Secret Manager Airflow Connection
  owner: framework-test
  schedule: null
  timezone: Asia/Seoul
  start_date: "2026-01-01"
  max_active_runs: 1
  dagrun_timeout_seconds: 3600
  tags: [sample, test, postgres, cloudsql, secret-manager, gcs]

business_date:
  type: daily

runtime:
  gcp_conn_id: google_cloud_default
  impersonation_chain: null
  postgres_connection_id: conn-sql-pg-udw-user1

grape_defaults:
  retries: 1
  retry_delay_seconds: 60
  execution_timeout_seconds: 1800
  connect_timeout_seconds: 30
  pool: default_pool
  priority_weight: 1

grapes:
  - grape_id: query_postgres
    type: postgres_sql
    sql_file: sql/010_query_business_date.sql
    # Optional because runtime.postgres_connection_id is defined.
    # connection_id: conn-sql-pg-udw-user1
    parameters:
      business_date: "{{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}"
    options:
      autocommit: false
      fetch: all
      max_fetch_rows: 10

  - grape_id: export_postgres_to_gcs
    type: postgres_to_gcs
    depends_on: [query_postgres]
    sql_file: sql/020_export_sample.sql
    parameters:
      business_date: "{{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}"
    destination:
      bucket: REPLACE_WITH_BUCKET
      object: "postgres/ujlim_sample/business_date={{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}/sample.csv"
    options:
      chunk_rows: 5000
      include_header: true
      execution_timeout_seconds: 3600
