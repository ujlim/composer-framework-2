version: 1

vine:
  vine_id: ujlim_sftp_merge_row_fin_sample
  description: Merge GCS CSV shards, send by SFTP, and create row-count FIN only
  owner: framework-test
  schedule: null
  timezone: Asia/Seoul
  start_date: "2026-09-22"
  max_active_runs: 1
  dagrun_timeout_seconds: 7200
  tags: [sample, test, gcs]

business_date:
  type: daily

runtime:
  project_id: gcp-prod-edp-sa-ubi
  location: asia-northeast3
  gcp_conn_id: google_cloud_default
  impersonation_chain: null

grape_defaults:
  retries: 1
  retry_delay_seconds: 60
  execution_timeout_seconds: 7200
  pool: default_pool
  priority_weight: 1

grapes:
  - grape_id: sftp_merge_row_fin
    type: gcs_to_sftp_runner
    runner:
      ssh_conn_id: conn-sftp-runner-1
    source:
      bucket: bucket-prod-sa-ubi-outbound-test-1
      prefix: "outbound/{{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}/"
    destination:
      target: gcp-sftp-test-1
      remote_dir: /upload
    options:
      merge_filename: "outbound_{{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}.csv"
      csv_header: true
      csv_encoding: utf-8
      fin_filename: "outbound_{{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}.fin"
      overwrite: false
      delete_source: false
      allow_empty: false
