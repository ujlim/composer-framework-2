version: 1

vine:
  vine_id: ujlim_pg_to_gcs_sample
  description: Sample Vine for PostgreSQL to GCS using dedicated DB password secret and Silver execution SA
  owner: framework-test
  schedule: null
  timezone: Asia/Seoul
  start_date: "2026-01-01"
  max_active_runs: 1
  dagrun_timeout_seconds: 7200
  tags: [sample, test, postgres, cloudsql, secret-manager, gcs, silver]

business_date:
  type: daily

runtime:
  gcp_conn_id: google_cloud_default
  # GCS access is performed as this Silver SA. Change to Gold SA for Gold workloads.
  impersonation_chain: sa-prod-sa-ubi-airflow-user-silver@gcp-prod-edp-sa-ubi.iam.gserviceaccount.com
  postgres_connection_id: conn-sql-pg-udw-user1

# Airflow Connection conn-sql-pg-udw-user1 stores connection metadata, not the DB password:
#   host=172.31.38.136
#   port=21001
#   schema=db_ubis_rpt
#   login=usr_airf_svc
#   extra:
#     password_project_id: gcp-prod-edp-sa-udw
#     password_secret_id: secret-db-password-prod-sa-udw-postgres-1-usr_airf_svc-1
#
# IAM:
#   Composer management SA -> password secret: roles/secretmanager.secretAccessor
#   Composer management SA -> Silver/Gold SA: roles/iam.serviceAccountTokenCreator
#   Silver/Gold SA -> destination bucket: required Storage object role

grape_defaults:
  retries: 1
  retry_delay_seconds: 60
  execution_timeout_seconds: 3600
  connect_timeout_seconds: 30
  pool: default_pool
  priority_weight: 1

grapes:
  - grape_id: export_postgres_to_gcs
    type: postgres_to_gcs
    sql_file: sql/010_export_sample.sql
    parameters:
      business_date: "{{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}"
    destination:
      bucket: REPLACE_WITH_BUCKET
      object: "postgres/ujlim_pg_to_gcs/business_date={{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}/sample.csv"
    options:
      chunk_rows: 5000
      include_header: true
      execution_timeout_seconds: 3600
