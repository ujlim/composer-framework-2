version: 1

vine:
  vine_id: ujlim_gcs_merge_delete_source_sample
  description: Merge multiple GCS CSV files and delete source shards after verification
  owner: framework-test
  schedule: null
  timezone: Asia/Seoul
  start_date: "2026-09-22"
  max_active_runs: 1
  dagrun_timeout_seconds: 7200
  tags: [sample, test, gcs]

business_date:
  type: daily

runtime:
  project_id: gcp-prod-edp-sa-ubi
  location: asia-northeast3
  gcp_conn_id: google_cloud_default
  impersonation_chain: null

grape_defaults:
  retries: 1
  retry_delay_seconds: 60
  execution_timeout_seconds: 7200
  pool: default_pool
  priority_weight: 1

grapes:
  - grape_id: merge_csv_delete_source
    type: gcs_merge_csv
    source:
      bucket: bucket-prod-sa-ubi-outbound-test-1
      prefix: "outbound/{{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}/"
      pattern: "*.csv"
    destination:
      object: "merged/outbound_{{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}.csv"
    options:
      csv_header: true
      csv_encoding: utf-8
      overwrite: true
      delete_source: true
      allow_empty: false
