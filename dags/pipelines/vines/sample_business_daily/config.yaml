version: 1

vine:
  vine_id: sample_business_daily_vine
  description: Sample Daily business context Vine
  owner: framework-test
  schedule: null
  timezone: Asia/Seoul
  start_date: "2026-01-01"
  max_active_runs: 1
  dagrun_timeout_seconds: 3600
  tags: [sample, test, business-date, daily, bigquery]

business_date:
  type: daily

runtime:
  project_id: gcp-prod-edp-sa-ubi
  location: asia-northeast3
  gcp_conn_id: google_cloud_default
  impersonation_chain: null
  labels:
    environment: test
    sample: business_date_daily

grape_defaults:
  retries: 0
  execution_timeout_seconds: 1800
  pool: default_pool
  priority_weight: 1
  deferrable: true
  force_rerun: true
  priority: INTERACTIVE

grapes:
  - grape_id: show_business_context
    type: bigquery_sql
    sql_file: sql/show_business_context.sql
    parameters:
      business_date:
        type: DATE
        value: "{{ ti.xcom_pull(task_ids='resolve_business_date')['business_date'] }}"
      period_start:
        type: DATE
        value: "{{ ti.xcom_pull(task_ids='resolve_business_date')['period_start'] }}"
      period_end:
        type: DATE
        value: "{{ ti.xcom_pull(task_ids='resolve_business_date')['period_end'] }}"
      period_type:
        type: STRING
        value: "{{ ti.xcom_pull(task_ids='resolve_business_date')['period_type'] }}"
